compute:
  platform: "Windows 11 Local Machine"
  cpu_cores: 8
  ram_gb: 16
  python_version: "3.13"
  os: "Windows 11"
  uses_gpu_for_inference: false
  has_network_during_ranking: false
  pre_computation_required: true
  pre_computation_time_minutes: 100

ai_tools_used:
  - "Claude"

ai_usage_summary: |
  Used Claude for architecture discussion, code review, and debugging.
  All engineering decisions, design choices, and implementation were made
  by the team. No candidate data was fed to any external LLM.
  The ranking system makes zero external API calls at inference time.

methodology_summary: |
  Two-stage CPU-only hybrid ranking pipeline. Stage 1 (precompute.py, ~1.7hr):
  encodes 100K career texts with BAAI/bge-small-en-v1.5, builds FAISS IndexFlatIP
  and BM25Okapi indexes, computes per-candidate features (skill quality, trajectory
  score, ML product years, behavioral gate, boolean gates). Stage 2 (rank.py, <5min):
  weighted combination of BM25 (0.20) + FAISS cosine (0.30) + skill quality (0.20)
  + trajectory (0.30), multiplied by YOE fit, ML product years fit, hard gates
  (honeypot x0.0, consulting x0.20, cv-speech x0.15, pure-research x0.15,
  framework-only x0.20), and behavioral multiplier (0.50-1.10). Trajectory score
  rewards production deployment evidence, pre-LLM ML depth, seniority level,
  and company prestige derived from industry and company_size fields.

track: "Track 1 - Data & AI Challenge"
submission_version: "1.0"

models_used:
  - name: "BAAI/bge-small-en-v1.5"
    source: "HuggingFace (sentence-transformers)"
    usage: "Text embedding for FAISS index and skill relevance scoring"
    runs_locally: true
    api_calls: false

libraries:
  - sentence-transformers==5.5.1
  - faiss-cpu==1.14.3
  - rank-bm25==0.2.2
  - scikit-learn==1.9.0
  - numpy
  - python-docx

runtime:
  precompute_hours: 1.7
  rank_minutes: 2
  hardware: "CPU only, no GPU"

no_external_api_calls: true
no_openai: true
no_anthropic: true
no_cloud_services: true

declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: true
  reproduction_tested: true
